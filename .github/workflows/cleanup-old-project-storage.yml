name: Cleanup old project storage

on:
  push:
    branches:
      - cleanup-old-storage
    paths:
      - .github/workflows/cleanup-old-project-storage.yml

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete all Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          deleted=0
          freed=0
          mapfile -t rows < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired == false) | [(.id|tostring), .name, (.size_in_bytes|tostring)] | @tsv'
          )
          for row in "${rows[@]}"; do
            IFS=$'\t' read -r id name size <<<"$row"
            echo "Deleting artifact: $name | $size bytes | id=$id"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id"
            deleted=$((deleted + 1))
            freed=$((freed + size))
          done
          echo "Deleted artifacts: $deleted"
          echo "Freed bytes (reported): $freed"
