name: Build Blackbox Vault APK
on:
  push:
    branches: [ blackbox-vault-apk ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check vault JavaScript
        run: node --check app/src/main/assets/app.js
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Blackbox-Vault.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Blackbox-Vault-APK
          path: Blackbox-Vault.apk
          if-no-files-found: error
