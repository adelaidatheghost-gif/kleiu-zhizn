name: Build Blackbox Vault APK
on:
  push:
    branches: [ blackbox-vault-apk ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Locate Android build tools
        run: |
          BT_VERSION="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "BUILD_TOOLS=$ANDROID_HOME/build-tools/$BT_VERSION" >> "$GITHUB_ENV"
          test -x "$ANDROID_HOME/build-tools/$BT_VERSION/apksigner"
          test -x "$ANDROID_HOME/build-tools/$BT_VERSION/zipalign"

      - name: Check vault JavaScript
        run: node --check app/src/main/assets/app.js

      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Restore persistent signing key from 1.1.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p signer
          gh run download 36201748340             --repo "$GITHUB_REPOSITORY"             --name Blackbox-Vault-Signing-Key             --dir signer
          test -f signer/blackbox-vault.jks
          test -f signer/BLACKBOX_SIGNING_INFO.txt

      - name: Align and sign APK
        shell: bash
        run: |
          set -euo pipefail
          PASS="$(sed -n 's/^store_password=//p' signer/BLACKBOX_SIGNING_INFO.txt)"
          echo "::add-mask::$PASS"

          "$BUILD_TOOLS/zipalign" -f -p 4             app/build/outputs/apk/release/app-release-unsigned.apk             Blackbox-Vault-aligned.apk

          "$BUILD_TOOLS/apksigner" sign             --ks signer/blackbox-vault.jks             --ks-key-alias blackbox             --ks-pass "pass:$PASS"             --key-pass "pass:$PASS"             --v1-signing-enabled true             --v2-signing-enabled true             --v3-signing-enabled true             --out Blackbox-Vault-1.1.3.apk             Blackbox-Vault-aligned.apk

      - name: Verify installable APK
        shell: bash
        run: |
          set -euo pipefail
          unzip -t Blackbox-Vault-1.1.3.apk >/dev/null
          "$BUILD_TOOLS/zipalign" -c -v 4 Blackbox-Vault-1.1.3.apk >/dev/null
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs Blackbox-Vault-1.1.3.apk | tee verify.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" verify.txt
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" verify.txt
          "$BUILD_TOOLS/aapt" dump badging Blackbox-Vault-1.1.3.apk | tee badging.txt
          grep -q "package: name='com.blackbox.vault.app'" badging.txt
          grep -q "versionName='1.1.3'" badging.txt
          sha256sum Blackbox-Vault-1.1.3.apk > Blackbox-Vault-1.1.3.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Blackbox-Vault-1.1.3-APK
          path: |
            Blackbox-Vault-1.1.3.apk
            Blackbox-Vault-1.1.3.sha256
            verify.txt
            badging.txt
          if-no-files-found: error
